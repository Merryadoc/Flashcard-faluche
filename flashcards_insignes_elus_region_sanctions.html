<!DOCTYPE html>

<title>Flashcards — Insignes, Élus, Région & Sanctions</title>
<style>
  :root {
    --bg: #faf9f5; --surface: #ffffff; --surface-2: #f4f2ea;
    --text: #1a1a1a; --text-2: #6b6b6b; --text-3: #a0a0a0;
    --border: rgba(0,0,0,0.1); --accent: #1a1a1a;
    --create: #5b3a8a; --create-bg: #ece4f7;
    --todo: #b08a3a; --todo-bg: #faf0d6;
    --ancien: #4a4a4a; --ancien-bg: #ebebeb;
    --tab-active-bg: #1a1a1a; --tab-active-fg: #faf9f5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a1a; --surface: #2a2a2a; --surface-2: #262626;
      --text: #f0f0f0; --text-2: #a0a0a0; --text-3: #6b6b6b;
      --border: rgba(255,255,255,0.1); --accent: #f0f0f0;
      --create: #b89dee; --create-bg: #2e2540;
      --todo: #e0c47a; --todo-bg: #3a3220;
      --ancien: #b0b0b0; --ancien-bg: #303030;
      --tab-active-bg: #f0f0f0; --tab-active-fg: #1a1a1a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 1.5rem 1rem; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
  h1 { font-size: 20px; font-weight: 500; margin: 0 0 1.25rem; text-align: center; }
  .fc-wrap { width: 100%; max-width: 620px; }
  .fc-tabs { display: flex; gap: 6px; margin-bottom: 1.25rem; flex-wrap: wrap; justify-content: center; }
  .fc-tabs button {
    flex: 1; min-width: 130px; padding: 10px 12px; font-size: 12.5px; font-weight: 500;
    background: var(--surface); color: var(--text); border: 0.5px solid var(--border);
    border-radius: 10px; cursor: pointer; transition: all 0.15s ease;
  }
  .fc-tabs button:hover { background: var(--surface-2); }
  .fc-tabs button.active {
    background: var(--tab-active-bg); color: var(--tab-active-fg);
    border-color: transparent;
  }
  .fc-header { display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 14px; font-size: 13px; color: var(--text-2); }
  .fc-count { font-weight: 500; color: var(--text); }
  .fc-mode { display: flex; gap: 6px; }
  button { font-family: inherit; font-size: 12px; padding: 6px 10px;
    background: transparent; color: var(--text); border: 0.5px solid var(--border);
    border-radius: 8px; cursor: pointer; transition: background 0.15s ease, transform 0.1s ease; }
  .fc-mode button:hover { background: var(--surface-2); }
  .fc-mode button:active { transform: scale(0.98); }
  .fc-progress { height: 3px; background: var(--surface-2); border-radius: 2px;
    overflow: hidden; margin-bottom: 14px; }
  .fc-progress-bar { height: 100%; background: var(--accent); transition: width 0.3s ease; }
  .fc-stage { perspective: 1400px; margin-bottom: 16px; }
  .fc-card { position: relative; width: 100%; min-height: 420px; cursor: pointer;
    transition: transform 0.55s cubic-bezier(0.4, 0, 0.2, 1); transform-style: preserve-3d; }
  .fc-card.flipped { transform: rotateY(180deg); }
  .fc-face { position: absolute; inset: 0; backface-visibility: hidden;
    -webkit-backface-visibility: hidden; display: flex; flex-direction: column;
    padding: 1.5rem 1.5rem 2rem; background: var(--surface);
    border: 0.5px solid var(--border); border-radius: 14px; overflow-y: auto; }
  .fc-front { align-items: center; justify-content: center; text-align: center; }
  .fc-back { transform: rotateY(180deg); background: var(--surface-2); }
  .fc-label { font-size: 12px; color: var(--text-2); margin-bottom: 14px;
    letter-spacing: 0.02em; text-align: center; }
  .fc-icon { font-size: 42px; margin-bottom: 14px; }
  .fc-name { font-size: 28px; font-weight: 500; line-height: 1.3; }
  .fc-back-name { font-size: 18px; font-weight: 500; line-height: 1.3;
    text-align: center; margin-bottom: 14px; padding-bottom: 12px;
    border-bottom: 0.5px solid var(--border); }
  .fc-section { margin-bottom: 14px; }
  .fc-section-title { font-size: 11px; color: var(--text-2);
    letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 6px; }
  .fc-signif { font-size: 14px; line-height: 1.55; font-weight: 500; }
  .fc-porteurs { display: flex; flex-wrap: wrap; gap: 6px; }
  .fc-porteur { font-size: 12px; padding: 4px 10px; background: var(--surface);
    border: 0.5px solid var(--border); border-radius: 8px; }
  .fc-porteur.todo { background: var(--todo-bg); color: var(--todo);
    border-color: transparent; font-style: italic; }
  .fc-porteur.ancien { background: var(--ancien-bg); color: var(--ancien);
    border-color: transparent; font-style: italic; }
  .fc-empty { font-size: 13px; color: var(--text-3); font-style: italic; }
  .fc-hint { text-align: center; font-size: 11px; color: var(--text-3);
    margin-top: auto; padding-top: 10px; }
  .fc-controls { display: flex; gap: 8px; }
  .fc-controls button { flex: 1; padding: 10px 12px; font-size: 14px; }
  .fc-help { margin-top: 16px; text-align: center; font-size: 11px;
    color: var(--text-3); line-height: 1.7; }
  .legend { display: inline-block; padding: 2px 8px; border-radius: 6px; font-weight: 500; }
  .legend.ancien { background: var(--ancien-bg); color: var(--ancien); font-style: italic; }
  .legend.todo { background: var(--todo-bg); color: var(--todo); font-style: italic; }
.back-home {
  position: fixed;
  top: 1rem;
  left: 1rem;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
  background: var(--surface);
  border: 0.5px solid var(--border);
  border-radius: 10px;
  text-decoration: none;
  transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
  z-index: 100;
  font-family: inherit;
}
.back-home:hover {
  background: var(--surface-2);
  transform: translateY(-1px);
}
.back-home:active {
  transform: scale(0.97);
}
.back-icon {
  font-size: 16px;
  line-height: 1;
}
@media (max-width: 480px) {
  .back-home {
    top: 0.75rem;
    left: 0.75rem;
    padding: 6px 10px;

  }
}

let currentCat = "insignes";
let deck = ALL_DATA[currentCat].cards.slice();
let index = 0;
let flipped = false;

const elCard = document.getElementById('fc-card');
const elIcon = document.getElementById('fc-icon');
const elName = document.getElementById('fc-name');
const elBackName = document.getElementById('fc-back-name');
const elSignif = document.getElementById('fc-signif');
const elPorteurs = document.getElementById('fc-porteurs');
const elPorteursSection = document.getElementById('fc-porteurs-section');
const elAnciens = document.getElementById('fc-anciens');
const elAnciensSection = document.getElementById('fc-anciens-section');
const elCountPorteurs = document.getElementById('fc-count-porteurs');
const elCatLabel = document.getElementById('fc-cat-label');
const elFrontLabel = document.getElementById('fc-front-label');
const elPos = document.getElementById('fc-position');
const elBar = document.getElementById('fc-bar');

function isTodo(name) {
  return name.startsWith('+ ') || name.includes('(non résolu');
}

function countItems(arr) {
  let total = 0;
  arr.forEach(n => {
    const m = n.match(/\+ (\d+)/);
    if (m) total += parseInt(m[1]);
    else total += 1;
  });
  return total;
}

function render() {
  const c = deck[index];
  elIcon.textContent = c.icon;
  elName.textContent = c.nom;
  elBackName.textContent = c.icon + ' ' + c.nom;
  elSignif.textContent = c.signif;
  elCatLabel.textContent = ALL_DATA[currentCat].label;
  elFrontLabel.textContent = ALL_DATA[currentCat].label;

  // Porteurs
  elPorteurs.innerHTML = '';
  const totalPorteurs = countItems(c.porteurs);
  elCountPorteurs.textContent = totalPorteurs;
  if (c.porteurs.length === 0) {
    const span = document.createElement('span');
    span.className = 'fc-empty';
    span.textContent = 'Aucun porteur actuel';
    elPorteurs.appendChild(span);
  } else {
    c.porteurs.forEach(n => {
      const span = document.createElement('span');
      span.className = isTodo(n) ? 'fc-porteur todo' : 'fc-porteur';
      span.textContent = n;
      elPorteurs.appendChild(span);
    });
  }

  // Anciens
  elAnciens.innerHTML = '';
  if (c.anciens.length === 0) {
    elAnciensSection.style.display = 'none';
  } else {
    elAnciensSection.style.display = '';
    c.anciens.forEach(n => {
      const span = document.createElement('span');
      span.className = isTodo(n) ? 'fc-porteur todo' : 'fc-porteur ancien';
      span.textContent = n;
      elAnciens.appendChild(span);
    });
  }

  elPos.textContent = (index + 1) + ' / ' + deck.length;
  elBar.style.width = Math.round(((index + 1) / deck.length) * 100) + '%';
  flipped = false;
  elCard.classList.remove('flipped');
}

function flip() { flipped = !flipped; elCard.classList.toggle('flipped', flipped); }
function next() { index = (index + 1) % deck.length; render(); }
function prev() { index = (index - 1 + deck.length) % deck.length; render(); }
function shuffle() {
  for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  index = 0; render();
}
function reset() { deck = ALL_DATA[currentCat].cards.slice(); index = 0; render(); }

function switchCat(cat) {
  currentCat = cat;
  deck = ALL_DATA[cat].cards.slice();
  index = 0;
  document.querySelectorAll('.fc-tabs button').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.cat === cat);
  });
  render();
}

elCard.addEventListener('click', flip);
document.getElementById('fc-flip').addEventListener('click', function(e) { e.stopPropagation(); flip(); });
document.getElementById('fc-next').addEventListener('click', next);
document.getElementById('fc-prev').addEventListener('click', prev);
document.getElementById('fc-btn-shuffle').addEventListener('click', shuffle);
document.getElementById('fc-btn-reset').addEventListener('click', reset);

document.querySelectorAll('.fc-tabs button').forEach(btn => {
  btn.addEventListener('click', () => switchCat(btn.dataset.cat));
});

document.addEventListener('keydown', function(e) {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); }
  else if (e.key === 'ArrowRight') next();
  else if (e.key === 'ArrowLeft') prev();
  else if (e.key === 's' || e.key === 'S') shuffle();
});

render();
</script>
</body>
</html>
