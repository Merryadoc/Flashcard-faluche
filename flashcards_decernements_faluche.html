<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcards — Décernements de la faluche</title>
<style>
  :root {
    --bg: #faf9f5;
    --surface: #ffffff;
    --surface-2: #f4f2ea;
    --text: #1a1a1a;
    --text-2: #6b6b6b;
    --text-3: #a0a0a0;
    --border: rgba(0,0,0,0.1);
    --border-2: rgba(0,0,0,0.2);
    --accent: #1a1a1a;
    --ancien: #4a4a4a; --ancien-bg: #ebebeb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a1a;
      --surface: #2a2a2a;
      --surface-2: #262626;
      --text: #f0f0f0;
      --text-2: #a0a0a0;
      --text-3: #6b6b6b;
      --border: rgba(255,255,255,0.1);
      --border-2: rgba(255,255,255,0.2);
      --accent: #f0f0f0;
      --ancien: #b0b0b0; --ancien-bg: #303030;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 2rem 1rem;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h1 {
    font-size: 20px;
    font-weight: 500;
    margin: 0 0 2rem;
    text-align: center;
  }
  .fc-wrap {
    width: 100%;
    max-width: 580px;
  }
  .fc-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    font-size: 13px;
    color: var(--text-2);
  }
  .fc-count { font-weight: 500; color: var(--text); }
  .fc-mode { display: flex; gap: 6px; }
  button {
    font-family: inherit;
    font-size: 12px;
    padding: 6px 10px;
    background: transparent;
    color: var(--text);
    border: 0.5px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  button:hover { background: var(--surface-2); }
  button:active { transform: scale(0.98); }
  .fc-progress {
    height: 3px;
    background: var(--surface-2);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 14px;
  }
  .fc-progress-bar {
    height: 100%;
    background: var(--accent);
    transition: width 0.3s ease;
  }
  .fc-stage {
    perspective: 1400px;
    margin-bottom: 16px;
  }
  .fc-card {
    position: relative;
    width: 100%;
    min-height: 340px;
    cursor: pointer;
    transition: transform 0.55s cubic-bezier(0.4, 0, 0.2, 1);
    transform-style: preserve-3d;
  }
  .fc-card.flipped { transform: rotateY(180deg); }
  .fc-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    display: flex;
    flex-direction: column;
    padding: 1.5rem 1.5rem 2.5rem;
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
  }
  .fc-front {
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .fc-back {
    transform: rotateY(180deg);
    background: var(--surface-2);
  }
  .fc-label {
    font-size: 12px;
    color: var(--text-2);
    margin-bottom: 14px;
    letter-spacing: 0.02em;
    text-align: center;
  }
  .fc-name {
    font-size: 26px;
    font-weight: 500;
    line-height: 1.3;
  }
  .fc-back-name {
    font-size: 16px;
    font-weight: 500;
    line-height: 1.3;
    text-align: center;
    margin-bottom: 18px;
    padding-bottom: 14px;
    border-bottom: 0.5px solid var(--border);
  }
  .fc-section { margin-bottom: 14px; }
  .fc-section-title {
    font-size: 11px;
    color: var(--text-2);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .fc-signif {
    font-size: 16px;
    font-weight: 500;
    line-height: 1.5;
  }
  .fc-porteurs {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .fc-porteur {
    font-size: 13px;
    padding: 4px 10px;
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: 8px;
  }
  .fc-porteur.ancien {
  background: var(--ancien-bg); color: var(--ancien);
  border-color: transparent; font-style: italic;
  }
  .fc-empty {
    font-size: 13px;
    color: var(--text-3);
    font-style: italic;
  }
  .fc-hint {
    position: absolute;
    bottom: 10px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 11px;
    color: var(--text-3);
  }
  .fc-controls {
    display: flex;
    gap: 8px;
  }
  .fc-controls button {
    flex: 1;
    padding: 10px 12px;
    font-size: 14px;
  }
  .fc-help {
    margin-top: 16px;
    text-align: center;
    font-size: 11px;
    color: var(--text-3);
  }
.back-home {
  position: fixed;
  top: 1rem;
  left: 1rem;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
  background: var(--surface);
  border: 0.5px solid var(--border);
  border-radius: 10px;
  text-decoration: none;
  transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
  z-index: 100;
  font-family: inherit;
}
.back-home:hover {
  background: var(--surface-2);
  transform: translateY(-1px);
}
.back-home:active {
  transform: scale(0.97);
}
.back-icon {
  font-size: 16px;
  line-height: 1;
}
@media (max-width: 480px) {
  .back-home {
    top: 0.75rem;
    left: 0.75rem;
    padding: 6px 10px;
    font-size: 12px;
  }
}
</style>
</head>
<body>

  { nom: "Ecureuil sur ruban pailleté", signif: "Boule d'énergie", porteurs: ["Jean le Clown intronisé Nika", "Sirius"], anciens: ["Rainha Bianca"], ["Calcifer"], ["Crasse Noisette"], ["Talkie-Walkie"], ["GaLacSie"] }
];

let deck = DATA.slice();
let index = 0;
let flipped = false;

const elCard = document.getElementById('fc-card');
const elName = document.getElementById('fc-name');
const elBackName = document.getElementById('fc-back-name');
const elSignif = document.getElementById('fc-signif');
const elPorteurs = document.getElementById('fc-porteurs');
const elPos = document.getElementById('fc-position');
const elBar = document.getElementById('fc-bar');
const elAnciens = document.getElementById('fc-anciens');
const elAnciensSection = document.getElementById('fc-anciens-section');

function render() {
  const c = deck[index];
  elName.textContent = c.nom;
  elBackName.textContent = c.nom;
  elSignif.textContent = c.signif;
  elPorteurs.innerHTML = '';
  if (c.porteurs.length === 0) {
    const span = document.createElement('span');
    span.className = 'fc-empty';
    span.textContent = 'Aucun porteur actuel';
    elPorteurs.appendChild(span);
  } else {
    c.porteurs.forEach(p => {
      const span = document.createElement('span');
      span.className = 'fc-porteur';
      span.textContent = p;
      elPorteurs.appendChild(span);
    });
  }
// Anciens porteurs
elAnciens.innerHTML = '';
if (!c.anciens || c.anciens.length === 0) {
  elAnciensSection.style.display = 'none';
} else {
  elAnciensSection.style.display = '';
  c.anciens.forEach(n => {
    const span = document.createElement('span');
    span.className = 'fc-porteur ancien';
    span.textContent = n;
    elAnciens.appendChild(span);
  });
}
  elPos.textContent = (index + 1) + ' / ' + deck.length;
  elBar.style.width = Math.round(((index + 1) / deck.length) * 100) + '%';
  flipped = false;
  elCard.classList.remove('flipped');
}

function flip() {
  flipped = !flipped;
  elCard.classList.toggle('flipped', flipped);
}

function next() { index = (index + 1) % deck.length; render(); }
function prev() { index = (index - 1 + deck.length) % deck.length; render(); }

function shuffle() {
  for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  index = 0;
  render();
}

function reset() { deck = DATA.slice(); index = 0; render(); }

elCard.addEventListener('click', flip);
document.getElementById('fc-flip').addEventListener('click', function(e) { e.stopPropagation(); flip(); });
document.getElementById('fc-next').addEventListener('click', next);
document.getElementById('fc-prev').addEventListener('click', prev);
document.getElementById('fc-btn-shuffle').addEventListener('click', shuffle);
document.getElementById('fc-btn-reset').addEventListener('click', reset);

document.addEventListener('keydown', function(e) {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); }
  else if (e.key === 'ArrowRight') next();
  else if (e.key === 'ArrowLeft') prev();
  else if (e.key === 's' || e.key === 'S') shuffle();
});

render();
</script>
</body>
</html>
